name: CodSpeed

# Runs the benchmark suite (benchmarks/) under CodSpeed, which reports the
# change in performance on pull requests against the base branch.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Do not cancel runs on main: every commit there needs a run, as the
  # baseline of the pull requests based on it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
    - main
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # for OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every benchmark drives a server (on another thread) backed by
        # PostgreSQL, so most of its time is spent blocked in system calls,
        # which the CPU simulation leaves out. `walltime` measures them, with
        # the noise of a shared runner (CodSpeed Macro Runners, which remove
        # it, need a GitHub organization); `simulation` is deterministic but
        # counts only the CPU work of the Python process.
        mode: [simulation, walltime]
    services:
      postgres:
        image: docker.io/postgres:16
        env:
          POSTGRES_PASSWORD: secret
        ports:
        - 5432:5432
        # The job starts once the server accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # get full history for `git describe` to produce version

    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        python-version: "3.13"

    - name: Install tiled
      run: uv sync --all-extras --locked
      env:
        TILED_BUILD_SKIP_UI: 1

    - name: Run benchmarks
      uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f  # v5.6.3
      env:
        TILED_TEST_POSTGRESQL_URI: postgresql://postgres:secret@localhost:5432
      with:
        mode: ${{ matrix.mode }}
        run: uv run pytest -c benchmarks/pytest.ini --codspeed
