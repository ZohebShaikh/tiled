[pytest]
testpaths =
    tests
addopts = -n auto --dist=loadfile
asyncio_mode = auto
log_cli = 1
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format=%Y-%m-%d %H:%M:%S
filterwarnings =
    # Starlette's TestClient (used by Context.from_app for in-process ASGI
    # testing) still relies on `httpx`. The suggested replacement, `httpx2`,
    # exposes incompatible types (e.g. its own URL class) that break
    # tiled.client.context, so we cannot migrate yet and instead silence
    # this known, unactionable warning.
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning
